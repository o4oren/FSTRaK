name: Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build (Release x64)
        run: msbuild FSTRaK.Tests/FSTRaK.Tests.csproj /t:Restore,Build /p:Configuration=Release /p:Platform=x64 /m /nr:false /v:m

      - name: Run unit tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $vstest = Join-Path $vsPath 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe'
          $dll = Get-ChildItem -Path FSTRaK.Tests\bin -Recurse -Filter FSTRaK.Tests.dll |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $dll) { throw 'FSTRaK.Tests.dll not found - build failed?' }
          # /TestAdapterPath is required: vstest does not auto-load the xunit
          # adapter from the output directory, and reports success with 0 tests.
          $log = & $vstest $dll /Platform:x64 "/TestAdapterPath:$(Split-Path $dll)" 2>&1
          $log | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($log -match 'No test is available') { throw 'No tests were discovered' }
          if (-not ($log -match 'Passed!')) { throw 'Test run did not report a passing summary' }
